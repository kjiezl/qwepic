security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        api:
            pattern: ^/api
            stateless: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            jwt: ~
            json_login:
                check_path: /api/auth/login
                username_path: username
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\UserChecker
            custom_authenticator: 
                - App\Security\LoginAuthenticator
                - App\Security\GoogleAuthenticator
            stateless: false
            logout:
                path: app_logout

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/api/auth/login, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }

        - { path: ^/api/customer/photographers, roles: PUBLIC_ACCESS }
        - { path: ^/api/customer, roles: ROLE_USER }
        - { path: ^/api, roles: PUBLIC_ACCESS, methods: [OPTIONS] }
        - { path: ^/api, roles: ROLE_USER }

        - { path: ^/verify/email,    roles: PUBLIC_ACCESS }

        - { path: ^/dashboard/photographer/bookings, roles: ROLE_PHOTOGRAPHER }
        - { path: ^/dashboard/bookings,             roles: ROLE_ADMIN }

        - { path: ^/dashboard/users,         roles: ROLE_ADMIN }
        - { path: ^/dashboard/activity-logs, roles: ROLE_ADMIN }

        - { path: ^/dashboard/albums,        roles: [ROLE_ADMIN, ROLE_PHOTOGRAPHER] }
        - { path: ^/dashboard/photos,        roles: [ROLE_ADMIN, ROLE_PHOTOGRAPHER] }

        - { path: ^/dashboard,               roles: [ROLE_ADMIN, ROLE_PHOTOGRAPHER] }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10

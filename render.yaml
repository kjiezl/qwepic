services:
  - type: web
    name: qwepic
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: qwepic-db
          property: connectionString
      - key: JWT_PASSPHRASE
        generateValue: true
      - key: JWT_SECRET_KEY
        value: config/jwt/private.pem
      - key: JWT_PUBLIC_KEY
        value: config/jwt/public.pem
      - key: CORS_ALLOW_ORIGIN
        value: "^https://.+\\.onrender\\.com$"
      - key: MESSENGER_TRANSPORT_DSN
        value: doctrine://default?auto_setup=0
      - key: MAILER_DSN
        value: null://null

databases:
  - name: qwepic-db
    databaseName: qwepic
    user: qwepic_user
    plan: free
